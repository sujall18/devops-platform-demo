name: CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "k8s/base/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/task-tracker-api

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps: update image tag in deployment manifest, commit back
      - name: Update image tag in deployment.yaml
        run: |
          NEW_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)"
          sed -i "s|image: .*task-tracker-api.*|image: ${NEW_TAG}|" k8s/base/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image tag to sha-$(git rev-parse --short HEAD)"
          git push

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the commit with the updated manifest
          ref: main

      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/devops-platform-demo
            git pull origin main
            kubectl apply -f k8s/base/namespace.yaml
            kubectl apply -f k8s/base/configmap.yaml
            kubectl apply -f k8s/base/secret.yaml
            kubectl apply -f k8s/base/postgres-statefulset.yaml
            kubectl apply -f k8s/base/deployment.yaml
            kubectl apply -f k8s/base/service.yaml
            kubectl apply -f k8s/base/ingress.yaml
            kubectl rollout status deployment/task-tracker -n task-tracker --timeout=120s
