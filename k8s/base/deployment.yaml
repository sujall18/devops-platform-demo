apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  namespace: task-tracker
  labels:
    app: task-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
      annotations:
        # Prometheus auto-discovery
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: task-tracker
          # Updated automatically by cd.yml via sed on each deploy
          image: ghcr.io/sujall18/task-tracker-api:sha-a52757b
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      # Pull from GHCR — secret only needed for private images
      # imagePullSecrets:
      #   - name: ghcr-secret
